<style>
/* Hub: dark gallery. Index on the left, topic plates in the centre, details on the right. */

html,body{height:100%}
body.hub{margin:0;background:var(--hub-bg);background-image:none;color:var(--ink);overflow:hidden;
-webkit-font-smoothing:antialiased}
body.hub::after{content:"";position:fixed;inset:0;pointer-events:none;

padding:max(18px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink)}
.mark b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:-.01em}
.mark b i{color:var(--accent)}
.mark span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{background:none;border:0;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
color:var(--dim);padding:6px 10px;border-radius:999px;white-space:nowrap;transition:color .2s,background .2s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--ink);background:var(--faint)}
.morelink{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-decoration:none;white-space:nowrap;padding:6px 0 6px 10px;flex-shrink:0}
.morelink:hover{color:var(--ink)}
/* three columns */
.main{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:32px;min-height:0;padding-top:22px}
/* index */
.index{min-height:0;overflow-y:auto;scrollbar-width:none;padding-right:4px;mask-image:linear-gradient(transparent,#000 24px,#000 calc(100% - 40px),transparent)}
.index::-webkit-scrollbar{display:none}
.index h3{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:22px 0 6px}
.index h3:first-child{margin-top:14px}
.row{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;cursor:pointer;text-align:left;

.row .t{flex:1;min-width:0}
.row .r{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.row:hover{color:var(--ink)}
.row[aria-current="true"]{color:var(--ink)}
.row[aria-current="true"] .t::before{content:"";display:inline-block;width:14px;height:1px;background:var(--accent);vertical-align:middle;margin-right:8px}
/* stage */
.stage{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;outline:none;user-select:none;touch-action:pan-y}
.track{position:relative;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.plate{position:absolute;left:50%;top:50%;width:var(--ps);height:var(--ps);margin:calc(var(--ps)/-2) 0 0 calc(var(--ps)/-2);
border:0;padding:0;background:none;cursor:pointer;border-radius:50%;
transition:transform .7s cubic-bezier(.22,.8,.24,1),opacity .6s ease,filter .6s ease;will-change:transform}
.plate svg{width:100%;height:100%;display:block;overflow:visible}
.plate .disc{fill:var(--plate);stroke:var(--rule);stroke-width:1}
.plate .inner{fill:none;stroke:var(--rule);stroke-width:1}
.plate .ticks{transform:rotate(var(--rot));transition:transform 1.1s cubic-bezier(.22,.8,.24,1);transform-origin:0 0}
.plate .ticks line{stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke}
.plate .ticks line.maj{stroke:var(--muted)}
.plate .art *{vector-effect:non-scaling-stroke}
.plate .label{font-family:var(--f-mono);font-size:6.2px;letter-spacing:.18em;fill:var(--dim);text-anchor:middle}
.art .k{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.86}
.art .m{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-linecap:round;opacity:.7}

.art .o{fill:none;stroke:var(--amber);stroke-width:1.8;stroke-linecap:round}
.art .fa{fill:var(--accent);opacity:.16;stroke:none}
.art .fa2{fill:var(--accent);opacity:.34;stroke:none}
.art .fk{fill:var(--ink);opacity:.86;stroke:none}
.art .fo{fill:var(--amber);stroke:none}
.art .fac{fill:var(--accent);stroke:none}
.art text{font-family:var(--f-display);font-style:italic;fill:var(--ink)}
.plate[data-d="0"]{cursor:default}
.plate[data-d="0"] .disc{stroke:#2A3147}
.caption{text-align:center;padding:10px 0 4px}
.caption .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.caption h1{font-family:var(--f-display);font-weight:300;font-size:clamp(28px,3.4vw,46px);letter-spacing:-.015em;margin:8px auto 0;max-width:18ch;line-height:1.08;min-height:2.16em;display:flex;align-items:flex-start;justify-content:center}
.navs{position:absolute;inset:0 0 auto;height:var(--th,60%);pointer-events:none}.nav{pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:rgba(10,13,22,.6);
color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s;z-index:5}
.nav:hover{color:var(--ink);border-color:var(--dim)}
.nav.prev{left:0}.nav.next{right:0}
.nav svg{width:16px;height:16px}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* details */
.details{min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:22px;padding:14px 2px 24px}
.details::-webkit-scrollbar{display:none}
.eyebrow2{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.details .lede2{font-family:var(--f-display);font-size:19px;line-height:1.45;color:var(--ink);font-weight:350;margin-top:10px}
.facts{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;border-top:1px solid var(--rule);padding-top:18px;font-size:13.5px}
.facts dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.facts dd{margin:0;color:var(--muted)}
.facts dd b{color:var(--ink);font-weight:500}
.quote{border-top:1px solid var(--rule);padding-top:16px}
.quote .q{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.quote .q i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--amber);align-self:center}
.quote.tip .q i{background:var(--accent)}
.quote p{margin-top:8px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.quote p b{color:var(--ink);font-weight:500}
.quote sup,.quote sub{font-size:.72em}
.open{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;text-decoration:none;
background:var(--ink);color:var(--hub-bg);border-radius:999px;padding:13px 20px;font-weight:500;font-size:14.5px;transition:background .2s}
.open:hover{background:var(--accent)}
.open svg{width:16px;height:16px}
.sub2{font-family:var(--f-mono);font-size:11px;color:var(--dim);text-align:center;margin-top:-10px}
.sub2 a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.sub2 a:hover{color:var(--ink)}
.kbdhint{position:absolute;bottom:4px;left:0;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.kbdhint kbd{font-family:inherit;border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin:0 2px;color:var(--muted)}
/* tablet: drop the index into the filters row */
@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr) 320px}.index{display:none}}
/* phone: one scrolling column */
@media (max-width:760px){
body.hub{overflow:auto}
.hubwrap{height:auto;min-height:100dvh;display:block;padding-left:16px;padding-right:16px}
.bar{flex-direction:column;align-items:flex-start;gap:12px;padding-bottom:12px}
.filters{width:100%;margin-left:-10px}
.main{display:flex;flex-direction:column;padding-top:8px}.stage{order:1}.details{order:2}.index{order:3}
.stage{height:auto}
.track{height:min(78vw,380px)}
.caption h1{min-height:0;font-size:30px}
.nav{display:none}
.kbdhint{display:none}
.details{overflow:visible;padding-top:22px}
.index{display:block;overflow:visible;mask-image:none;border-top:1px solid var(--rule);margin-top:10px;padding-top:6px}
.index::before{content:"All topics";display:block;font-family:var(--f-display);font-size:24px;font-weight:300;margin:14px 0 0}
}
@media (prefers-reduced-motion:reduce){.plate,.plate .ticks{transition:none}.fade{animation:none}}
</style>

<script>
(function(){
"use strict";
const TOPICS=[{"unit":"algebra","id":"direct","ref":"SL 1.6","title":"Direct proof","lede":"Write the general case in algebra, then rearrange it until the claim is visible. One argument covers every integer at once.","trap":"Examples prove nothing about \"every n\". They score 0.","tip":"<b>Let n, write it, factor it, say why.<\/b>"},{"unit":"algebra","id":"indsum","ref":"AHL 1.15","title":"Induction: series","lede":"Prove the first case, prove that each case forces the next, and every case follows, like a line of falling dominoes.","trap":"Never assume P(k + 1). Write it as the target, then reach it.","tip":"<b>Base, Assume, Add the next term, Aim at the target, Announce.<\/b>"},{"unit":"algebra","id":"inddiv","ref":"AHL 1.15","title":"Induction: divisibility","lede":"Show f(1) is a multiple of d, then write f(k + 1) as a multiple of f(k) plus something that is clearly a multiple of d.","trap":"\"Assume divisible by d\" with no letter gives nothing to substitute. Write f(k) = dm.","tip":"<b>Split one power off, substitute, factor out d.<\/b>"},{"unit":"algebra","id":"indmore","ref":"AHL 1.15","title":"Induction: inequalities and derivatives","lede":"Start the chain where the statement starts being true, and in the step build an inequality one link at a time.","trap":"The base case is the starting value in the question, not n = 1.","tip":"<b>Peel off, use P(k), compare, chain.<\/b>"},{"unit":"algebra","id":"contra","ref":"AHL 1.15","title":"Proof by contradiction","lede":"Assume the statement is false, follow the consequences, and reach something impossible. The assumption must be wrong.","trap":"Leave out \"no common factor\" and there is no contradiction at the end.","tip":"<b>Suppose not. Push until something is both true and false.<\/b>"},{"unit":"algebra","id":"counter","ref":"AHL 1.15","title":"Counterexamples","lede":"A \"for all\" claim needs a proof to be true, but only one case to be false. Find that case and check it fully.","trap":"Show the arithmetic. \"n = 40 works\" alone is not a counterexample.","tip":"<b>One case kills \"for all\". Check condition ✓, conclusion ✗.<\/b>"},{"unit":"algebra","id":"cart","ref":"AHL 1.12","title":"Cartesian form and the Argand diagram","lede":"A complex number a + bi is a point (a, b). Adding is moving, multiplying needs i² = −1, and dividing means making the bottom real.","trap":"Im(3 − 4i) is −4, not −4i.","tip":"<b>i² = −1, then tidy.<\/b>"},{"unit":"algebra","id":"polar","ref":"AHL 1.13","title":"Modulus-argument and Euler form","lede":"Describe a complex number by its distance from O and its angle. Then multiplying is just scaling and rotating.","trap":"arctan(b/a) is wrong in the second and third quadrants: sketch first.","tip":"<b>Sketch, then argue: the quadrant fixes θ.<\/b>"},{"unit":"algebra","id":"polyroots","ref":"AHL 1.14 · 2.12","title":"Polynomial roots and conjugate pairs","lede":"A polynomial with real coefficients has its non-real roots in conjugate pairs. Each pair multiplies out to a real quadratic factor.","trap":"Conjugate pairs need REAL coefficients. Say so when you use it.","tip":"<b>Root p + qi ⇒ factor z² − 2pz + (p² + q²).<\/b>"},{"unit":"algebra","id":"demoivre","ref":"AHL 1.14","title":"De Moivre's theorem","lede":"Raising r cis θ to the power n raises r to the power n and multiplies the angle by n. Powers become spirals.","trap":"Raise the modulus to the power too: (2 cis θ)³ = 8 cis 3θ, not 2 cis 3θ.","tip":"<b>Polar, power, reduce, convert back.<\/b>"},{"unit":"algebra","id":"croots","ref":"AHL 1.14","title":"Roots of complex numbers","lede":"zⁿ = w has exactly n solutions. They share one modulus and sit evenly round a circle, at the corners of a regular polygon.","trap":"Add 2kπ BEFORE dividing by n.","tip":"<b>+ 2kπ, then ÷ n.<\/b>"},{"unit":"probability","id":"basics","ref":"SL 4.5 – 4.6","title":"Events, Venn diagrams and the addition rule","lede":"An event is a set of outcomes. Most questions about two events come down to the four regions of a Venn diagram. Once you know all four, you can answer anything.","trap":"Mutually exclusive is <b>not<\/b> independent. If A and B can't both happen, knowing A happened tells you B didn't. That is dependence.","tip":"<b>ME<\/b> = \"can't both\". <b>IND<\/b> = \"doesn't care\"."},{"unit":"probability","id":"conditional","ref":"SL 4.6, 4.11","title":"Conditional probability and tree diagrams","lede":"\"Given that B happened\" means you throw away every outcome outside B. B becomes your new sample space, so P(B) becomes the denominator.","trap":"P(A | B) ≠ P(B | A). P(rain | clouds) is not P(clouds | rain).","tip":"<b>\"Given\" = new denominator.<\/b>"},{"unit":"probability","id":"bayes","ref":"AHL 4.13","title":"Bayes' theorem","lede":"Bayes reverses a conditional. The tree gives you P(evidence | cause). The question wants P(cause | evidence).","trap":"Sensitivity = P(+ | ill). Specificity = P(− | healthy). The false positive rate is 1 − specificity.","tip":"<b>Bayes = one path ÷ all paths to the evidence.<\/b>"},{"unit":"probability","id":"counting","ref":"AHL 1.10 · used in probability","title":"Counting: permutations and combinations","lede":"When outcomes are equally likely, probability is a counting problem: favourable ÷ total. The only real question is whether order matters.","trap":"Never count \"at least one\" as \"pick one, then pick any\". That double counts.","tip":"<b>P for Position<\/b> (order matters). <b>C for Choose<\/b> (it doesn't)."},{"unit":"probability","id":"discrete","ref":"SL 4.7 · AHL 4.14","title":"Discrete random variables","lede":"A random variable X turns each outcome into a number. \"Discrete\" means you can list its values. The table of values and probabilities is its whole description.","trap":"E(X²) ≠ [E(X)]². Compute E(X²) separately.","tip":"<b>Shift moves the mean, not the spread.<\/b>"},{"unit":"probability","id":"binomial","ref":"SL 4.8","title":"Binomial distribution","lede":"Count the number of successes in a fixed number of identical, independent trials. X ~ B(n, p).","trap":"\"More than 3\" starts at 4. \"At least 3\" starts at 3.","tip":"<b>Strict sign? Step one integer inward.<\/b> &lt; 4 → Upper 3; &gt; 4 → Lower 5."},{"unit":"probability","id":"normal","ref":"SL 4.9, 4.12","title":"Normal distribution","lede":"The model for continuous measurements that cluster symmetrically around a mean: heights, masses, exam scores, errors. X ~ N(μ, σ²).","trap":"N(50, 16) means σ² = 16, so <b>σ = 4<\/b>. The calculator wants σ.","tip":"<b>z = \"how many σ from μ\".<\/b>"},{"unit":"probability","id":"continuous","ref":"AHL 4.14","title":"Continuous random variables","lede":"A probability density function f(x) describes a continuous variable. Probabilities are areas, so every question is an integral.","trap":"The mode can sit at an endpoint, where f′(x) ≠ 0.","tip":"<b>Area = probability. Balance = mean. Half-area = median. Peak = mode.<\/b>"},{"unit":"vectors","id":"vec","ref":"AHL 3.12","title":"Vector basics","lede":"Vectors describe movement from one place to another. This page covers position vectors, displacement, length, unit vectors, and dividing a line in a ratio.","trap":"AB and BA are opposites: AB = −BA.","tip":"<b>End minus start.<\/b> Always AB = b − a."},{"unit":"vectors","id":"dot","ref":"AHL 3.13","title":"Scalar product","lede":"The scalar product turns two vectors into one number that tells you how much they point the same way.","trap":"The dot product is a number. A vector answer loses the mark.","tip":"<b>Perpendicular? Dot = 0.<\/b>"},{"unit":"vectors","id":"cross","ref":"AHL 3.15","title":"Vector product","lede":"The vector product takes two vectors and produces a third, perpendicular to both. Its size is an area.","trap":"Order matters: b × a points the opposite way.","tip":"<b>Dot uses cos, cross uses sin.<\/b>"},{"unit":"vectors","id":"line","ref":"AHL 3.14","title":"Lines","lede":"A line in 3D needs a point and a direction. There is no y = mx + c, because a line in space has no single gradient.","trap":"To show a point is on the line, check all three components.","tip":"<b>Point + direction.<\/b>"},{"unit":"vectors","id":"lines2","ref":"AHL 3.14","title":"Two lines","lede":"In 2D, lines that are not parallel always meet. In 3D they can pass without touching: parallel, intersecting, coincident or skew.","trap":"Use different letters, λ and μ, for the two lines.","tip":"<b>Parallel? Same line? Else solve two, test the third.<\/b>"},{"unit":"vectors","id":"plane","ref":"AHL 3.16","title":"Planes","lede":"A plane is pinned down by a point and a normal, a vector sticking out at right angles.","trap":"n = b × c uses the two directions, never the point.","tip":"<b>Normal first (cross), then d (dot).<\/b>"},{"unit":"vectors","id":"lp","ref":"AHL 3.16","title":"Line and plane","lede":"A line and a plane can meet at one point, never meet, or the line can lie inside the plane.","trap":"The angle with the plane uses sin, not cos.","tip":"<b>Line into plane → one equation in λ.<\/b>"},{"unit":"vectors","id":"pp","ref":"AHL 3.16","title":"Planes meeting","lede":"Two planes meet in a line. Three planes can meet at a point, along a line, or not at all.","trap":"The right-hand sides d never affect the angle or the direction.","tip":"<b>det ≠ 0: a point. det = 0: eliminate and look at the last line.<\/b>"},{"unit":"calculus","id":"limits","ref":"SL 5.1 · AHL 5.12","title":"Limits, continuity and first principles","lede":"The derivative is the limit of chord gradients as the second point slides into the first. Continuity and differentiability are about whether that limit exists.","trap":"Using the power rule when \"first principles\" is asked scores 0.","tip":"<b>Expand, cancel, divide by h, then h → 0.<\/b>"},{"unit":"calculus","id":"lhop","ref":"AHL 5.13","title":"L'Hôpital's rule","lede":"When a limit comes out as 0/0 or ∞/∞, compare how fast the top and bottom are changing instead of what they are.","trap":"Check the form every time. On a non-0/0 fraction the rule gives wrong answers.","tip":"<b>Substitute first. 0/0? Differentiate top and bottom.<\/b>"},{"unit":"calculus","id":"diff","ref":"SL 5.3, 5.6 · AHL 5.15","title":"Differentiation rules","lede":"Most functions are built from simple ones by multiplying, dividing or nesting. Each way of building has its own rule.","trap":"Chain rule: multiply by the inner derivative; it is easy to forget the \"× 2\" in sin 2x.","tip":"<b>Outer′(inner) × inner′.<\/b>"},{"unit":"calculus","id":"tangent","ref":"SL 5.2, 5.4","title":"Tangents, normals, increasing and decreasing","lede":"The derivative at a point is the gradient of the tangent there. Its sign says whether the function is going up or down.","trap":"The y-coordinate comes from f, not f′.","tip":"<b>Gradient from f′, point from f.<\/b>"},{"unit":"calculus","id":"curve","ref":"SL 5.7, 5.8","title":"Stationary points, concavity and inflexion","lede":"Line up the graphs of f, f′ and f″ and every feature of one shows up as a feature of the next.","trap":"f″ = 0 alone is not an inflexion: show the sign change.","tip":"<b>f′ = 0 finds them, f″ sorts them.<\/b>"},{"unit":"calculus","id":"optim","ref":"SL 5.8 · AHL 5.14","title":"Optimisation","lede":"Write the quantity you want to make biggest or smallest as a function of one variable, then find where its derivative is zero.","trap":"Use the constraint to get ONE variable before differentiating.","tip":"<b>Name it, constrain it, differentiate it, justify it.<\/b>"},{"unit":"calculus","id":"implicit","ref":"AHL 5.14","title":"Implicit differentiation and related rates","lede":"Differentiate an equation in x and y term by term, treating y as a function of x. The same chain rule links rates that change together in time.","trap":"Forgetting dy/dx on a y-term.","tip":"<b>Every y gets a dy/dx.<\/b>"},{"unit":"calculus","id":"integ","ref":"SL 5.5, 5.10, 5.11","title":"Integration and the fundamental theorem","lede":"Integration undoes differentiation, and a definite integral adds up thin strips to give the signed area under a curve.","trap":"+ c on every indefinite integral.","tip":"<b>Up one, divide by the new power.<\/b>"},{"unit":"calculus","id":"tech","ref":"AHL 5.15, 5.16","title":"Integration techniques: parts, substitution, partial fractions","lede":"When an integral isn't standard, rewrite it until it is: undo a product rule, change the variable, or split the fraction.","trap":"By parts: u = the polynomial with eˣ or trig, but u = ln x whenever ln x appears.","tip":"<b>LIATE picks u.<\/b>"},{"unit":"calculus","id":"area","ref":"SL 5.5, 5.11 · AHL 5.17","title":"Areas between curves","lede":"Area is the integral of (top curve − bottom curve), between the points where they meet, with every piece counted as positive.","trap":"A negative answer is never an area.","tip":"<b>Top minus bottom, meet to meet.<\/b>"},{"unit":"calculus","id":"volume","ref":"AHL 5.17","title":"Volumes of revolution","lede":"Spin a region about an axis and slice the solid into thin discs. Each disc has volume π r² × thickness.","trap":"Square before integrating: π(∫y dx)² is wrong.","tip":"<b>Disc: π y² dx. Square first.<\/b>"},{"unit":"calculus","id":"kinem","ref":"SL 5.9","title":"Kinematics","lede":"Displacement, velocity and acceleration are one chain: differentiate to go down it, integrate to come back up.","trap":"Distance needs |v|: split where v = 0, or use abs on the GDC.","tip":"<b>s → v → a: differentiate.<\/b>"},{"unit":"calculus","id":"maclaurin","ref":"AHL 5.19","title":"Maclaurin series","lede":"Build a polynomial that matches a function's value, slope, curvature and so on at x = 0. Near 0 it is an excellent stand-in for the function.","trap":"Divide by k!, not k.","tip":"<b>Substitute into a known series first.<\/b>"},{"unit":"calculus","id":"euler","ref":"AHL 5.18","title":"Modelling and Euler's method","lede":"Turn a sentence about a rate into an equation, then estimate its solution by following the slope one small step at a time.","trap":"Use the slope at the <em>old<\/em> point. Update x and y only after computing the slope.","tip":"<b>New = old + h × slope at old.<\/b>"},{"unit":"calculus","id":"sep","ref":"AHL 5.18","title":"Separation of variables","lede":"When dy/dx is a function of x times a function of y, move each variable to its own side and integrate both sides.","trap":"One constant only. Two constants (one per side) combine into one.","tip":"<b>y's with dy, x's with dx, one + c.<\/b>"},{"unit":"calculus","id":"homog","ref":"AHL 5.18","title":"Homogeneous equations: y = vx","lede":"When dy/dx depends only on the ratio y/x, the substitution y = vx turns the equation into one you can separate.","trap":"dy/dx = v + x dv/dx, not just dv/dx. The product rule is the whole point.","tip":"<b>Divide by x until only y/x is left.<\/b>"},{"unit":"calculus","id":"ifac","ref":"AHL 5.18","title":"Integrating factor","lede":"For linear equations dy/dx + P(x)y = Q(x), multiply through by a factor that turns the left side into one derivative.","trap":"Divide to get dy/dx on its own before finding P.","tip":"<b>Standard form, I = e<sup>∫P<\/sup>, (Iy)′ = IQ, integrate, divide.<\/b>"}];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const f=n=>Math.round(n*10)/10;
const L=(a,b,c,d,k='k')=>`<line class="${k}" x1="${f(a)}" y1="${f(b)}" x2="${f(c)}" y2="${f(d)}"/>`;
const P=(d,k='k')=>`<path class="${k}" d="${d}"/>`;
const O=(x,y,r,k='k')=>`<circle class="${k}" cx="${f(x)}" cy="${f(y)}" r="${r}"/>`;
const Ar=(a,b,c,d,k='k',h=7)=>{const t=Math.atan2(d-b,c-a),s=.45;return L(a,b,c,d,k)+P(`M${f(c-h*Math.cos(t-s))} ${f(d-h*Math.sin(t-s))}L${f(c)} ${f(d)}L${f(c-h*Math.cos(t+s))} ${f(d-h*Math.sin(t+s))}`,k);};
const poly=(pts,k='k')=>P('M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L'),k);
const fn=(g,x0,x1,n=60)=>{const p=[];for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;p.push([x,g(x)]);}return p;};
const iso=(x,y,z,s=1)=>[(x-y)*.87*s,(x+y)*.5*s-z*s];
const quad=(pts,k)=>poly(pts.concat([pts[0]]),k);
const T=(x,y,s,t,anchor='middle')=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="${anchor}">${t}</text>`;

polar:()=>{const r=52,t=-0.8;return L(-62,0,62,0,'m')+L(0,62,0,-62,'m')+O(0,0,r,'m d')+Ar(0,0,r*Math.cos(t),r*Math.sin(t),'a')+P('M18 0A18 18 0 0 0 '+f(18*Math.cos(t))+' '+f(18*Math.sin(t)),'o')+T(26,-5,15,'θ','start');},
polyroots:()=>L(-62,0,62,0,'m')+L(-6,58,-6,-58,'m')+L(24,-34,24,34,'m d')+O(24,-34,5,'fac')+O(24,34,5,'fac')+O(-36,0,5,'fo'),
demoivre:()=>{const p=[];for(let k=0;k<9;k++){const r=9*Math.pow(1.24,k),t=-k*0.72;p.push([r*Math.cos(t),r*Math.sin(t)]);}return O(0,0,9,'m d')+poly(p,'m')+p.map((q,i)=>O(q[0],q[1],i===8?4:2.6,i===8?'fac':'fk')).join('');},
croots:()=>{const r=46,p=[];for(let k=0;k<5;k++){const t=-Math.PI/2+k*2*Math.PI/5+0.2;p.push([r*Math.cos(t),r*Math.sin(t)]);}return O(0,0,r,'m d')+poly(p.concat([p[0]]),'a')+p.map((q,i)=>O(q[0],q[1],3.4,i?'fac':'fo')).join('');},
euler:()=>{const g=x=>40-62*Math.exp((x-60)/42);let s=L(-64,40,64,40,'m')+poly(fn(g,-60,60),'k');let x=-60,y=g(-60);const pts=[[x,y]];for(let i=0;i<4;i++){const sl=(g(x+.01)-g(x))/.01;x+=30;y+=sl*30;pts.push([x,y]);}return s+poly(pts,'a')+pts.map(p=>O(p[0],p[1],2.6,'fac')).join('');},
sep:()=>{let s='';for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){const x=i*17,y=j*17;if(x*x+y*y>62*62)continue;const m=-(x)/(y===0?.001:y)*.6;const t=Math.atan(m),r=6;s+=L(x-r*Math.cos(t),y-r*Math.sin(t),x+r*Math.cos(t),y+r*Math.sin(t),(i===1&&j===-2)?'a':'k');}return s+P('M-28 -52A60 60 0 0 0 -28 52','m d');},
homog:()=>{let s='';[-1.1,-.55,0,.55,1.1].forEach(t=>{s+=L(0,0,62*Math.cos(t),62*Math.sin(t)*-1,'m d');});[-1.1,-.55,0,.55,1.1].forEach((t,k)=>{const sl=Math.tan(t)+.5,u=Math.atan(sl);[24,44].forEach(r=>{const x=r*Math.cos(t),y=-r*Math.sin(t),q=5.5;s+=L(x-q*Math.cos(u),y+q*Math.sin(u),x+q*Math.cos(u),y-q*Math.sin(u),k===3?'a':'k');});});return s+O(0,0,2.6,'fk');},
ifac:()=>{let s=L(-64,40,64,40,'m');[-60,-30,0,30,60].forEach((c,k)=>{const g=x=>{const t=(x+60)/30;return 10-6*t+c*Math.exp(-t);};s+=poly(fn(x=>Math.max(-58,Math.min(52,g(x))),-58,58),k===2?'a':'m');});return s;}
};
const ticks=(()=>{let s='<g class="ticks">';for(let i=0;i<72;i++){const t=i*5*Math.PI/180,maj=i%6===0,r1=maj?86:89;s+=`<line class="${maj?'maj':''}" x1="${f(r1*Math.cos(t))}" y1="${f(r1*Math.sin(t))}" x2="${f(92*Math.cos(t))}" y2="${f(92*Math.sin(t))}"/>`;}return s+'</g>';})();
const plateSVG=t=>`<svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="disc" r="97"/>${ticks}<circle class="inner" r="80"/><g class="art">${(ART[t.id]||(()=>''))()}</g><text class="label" y="74">${esc(String(t.ref).split(' · used')[0].toUpperCase())}</text></svg>`;

/* ---------- state ---------- */
let filter='all',list=TOPICS.slice(),cur=0,rot=0;
const track=$('#track'),stage=$('#stage');
let plates=[];
function buildFilters(){
const opts=[['all','All']].concat(ORDER.map(u=>[u,UNIT[u].name]));
$('#filters').innerHTML=opts.map(([k,n])=>`<button data-f="${k}" aria-pressed="${k===filter}">${esc(n)}</button>`).join('');
$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
}
function setFilter(k){
const keep=list[cur];filter=k;
list=TOPICS.filter(t=>k==='all'||t.unit===k);
const i=list.indexOf(keep);cur=i<0?0:i;
buildFilters();buildPlates();buildIndex();render(true);
}
function buildPlates(){
track.innerHTML=list.map((t,i)=>`<button class="plate" data-i="${i}" aria-label="${esc(t.title)}">${plateSVG(t)}</button>`).join('');
plates=[...track.querySelectorAll('.plate')];
plates.forEach(p=>p.onclick=()=>{const i=+p.dataset.i;if(i===cur)open();else go(i);});
}
function buildIndex(){
let h='';ORDER.forEach(u=>{const items=list.filter(t=>t.unit===u);if(!items.length)return;
h+=`<h3>${UNIT[u].n} · ${esc(UNIT[u].name)}</h3>`+items.map(t=>`<button class="row" data-i="${list.indexOf(t)}"><span class="t">${esc(t.title)}</span><span class="r">${esc(sref(t.ref))}</span></button>`).join('');});
$('#index').innerHTML=h;
$('#index').querySelectorAll('.row').forEach(b=>b.onclick=()=>{go(+b.dataset.i);if(innerWidth<=760)stage.scrollIntoView({behavior:'smooth'});});
}
function score(t){try{const S=JSON.parse(localStorage.getItem('ibprob-score')||'{}')||{};const s=S[t.unit==='probability'?t.id:t.unit+'.'+t.id];return s&&s.a?s:null;}catch(e){return null;}}
const sref=r=>String(r).split(' · used')[0];
const href=t=>`${t.unit}/#${t.id}`;
function render(instant){layout(instant);content();}
function layout(instant){
const n=list.length,ps=Math.max(150,Math.min(track.clientHeight*.86,track.clientWidth*.5,440));
stage.style.setProperty('--ps',ps+'px');document.documentElement.style.setProperty('--rot',rot+'deg');
plates.forEach((p,i)=>{let d=i-cur;if(d>n/2)d-=n;if(d<-n/2)d+=n;const a=Math.abs(d);
const x=[0,.8,1.34,1.7][Math.min(a,3)]*ps*Math.sign(d),s=[1,.5,.3,.2][Math.min(a,3)];
if(instant)p.style.transition='none';
p.style.transform=`translateX(${x}px) scale(${s})`;p.style.opacity=a===0?1:a===1?.42:a===2?.14:0;
p.style.filter=a?'saturate(.4)':'none';p.style.pointerEvents=a>2?'none':'auto';p.style.zIndex=10-a;p.dataset.d=a;
p.tabIndex=a===0?0:-1;
if(instant){p.offsetWidth;p.style.transition='';}});
stage.style.setProperty('--th',track.clientHeight+'px');}
function content(){const n=list.length;
const t=list[cur];if(!t)return;
$('#count').textContent=String(cur+1).padStart(2,'0')+' / '+String(n).padStart(2,'0');
const ti=$('#title');ti.textContent=t.title;ti.classList.remove('fade');void ti.offsetWidth;ti.classList.add('fade');
const sc=score(t);
$('#details').innerHTML=`<div class="fade"><div class="eyebrow2">Topic ${UNIT[t.unit].n} · ${esc(UNIT[t.unit].name)}</div>
<p class="lede2">${t.lede}</p></div>
<dl class="facts fade"><dt>Syllabus</dt><dd><b>${esc(t.ref)}</b></dd>
<dt>Inside</dt><dd>The idea · Live model · 3 worked examples · Practice</dd>
<dt>Calculator</dt><dd>Casio fx-CG50 and TI-84 Plus CE</dd>
<dt>Practice</dt><dd>${sc?`<b>${sc.c} / ${sc.a}</b> correct in this browser`:'Not started'}</dd></dl>
${t.trap?`<div class="quote fade"><div class="q">Trap<i></i></div><p>${t.trap}</p></div>`:''}
${t.tip?`<div class="quote tip fade"><div class="q">Shorthand<i></i></div><p>${t.tip}</p></div>`:''}
<a class="open" href="${href(t)}">Open topic<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
<div class="sub2"><a href="${t.unit}/">${esc(UNIT[t.unit].name)} overview</a></div>`;
document.querySelectorAll('.row').forEach(r=>{const on=+r.dataset.i===cur;r.setAttribute('aria-current',on);if(on&&innerWidth>1180)r.scrollIntoView({block:'nearest'});});
try{history.replaceState(null,'','#'+t.unit+'/'+t.id);}catch(e){}
}
function go(i){const n=list.length;const next=((i%n)+n)%n;let d=next-cur;if(d>n/2)d-=n;if(d<-n/2)d+=n;rot+=d*-30;cur=next;render();}
function open(){const t=list[cur];if(t)location.href=href(t);}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(cur+1);}
else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(cur-1);}
else if(e.key==='Enter'&&(e.target===document.body||e.target===stage)){open();}});
let wheelLock=0;stage.addEventListener('wheel',e=>{const v=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(v)<8)return;e.preventDefault();const now=Date.now();if(now<wheelLock)return;wheelLock=now+420;go(cur+(v>0?1:-1));},{passive:false});
let sx=null,sy=0;stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){go(cur+(dx<0?1:-1));}});
stage.addEventListener('click',e=>{if(Math.abs((e.clientX||0)-(sx??e.clientX))>10)e.stopPropagation();},true);
addEventListener('resize',()=>layout(true));
/* start: restore #unit/topic if present */
const h=(location.hash||'').slice(1).split('/');
const s0=TOPICS.findIndex(t=>t.unit===h[0]&&t.id===h[1]);
buildFilters();buildPlates();buildIndex();cur=s0<0?0:s0;render(true);
})();
</script>
</body>
</html>
